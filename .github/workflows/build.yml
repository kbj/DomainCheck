name: Build

# Any code update triggers a build. Manual runs are also handy.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test -race ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compile
        env:
          CGO_ENABLED: "0" # static binaries, no C toolchain needed for cross builds
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          OUT="DomainCheck-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && OUT="${OUT}.exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/${OUT}" .

      - name: Smoke check binary exists
        run: ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DomainCheck-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
